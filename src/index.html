<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <link href="./output.css" rel="stylesheet" />
    <link rel="icon" type="image/png" href="./icons/sun.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap"
      rel="stylesheet"
    />
  </head>

  <body
    class="min-h-screen bg-linear-to-br from-[#F8FBFF] via-[#EEF5FF] to-[#DCEBFF] p-3 pt-7 font-['Inter'] dark:from-[#0B1020] dark:via-[#0A0E1C] dark:to-[#0B1020] transition-colors duration-300"
  >
    <main class="mx-auto max-w-6xl">
      <!--Search section Begins-->
      <div class="flex items-start gap-4" id="search">
        <!-- Search -->
        <div class="relative flex w-full flex-col">
          <div
            class="flex h-14 items-center gap-3 rounded-2xl border border-[#E6EEF8] bg-white px-5 shadow-[0_12px_35px_rgba(15,23,42,0.08)] transition-all duration-300 hover:border-slate-300 hover:shadow-[0_16px_40px_rgba(15,23,42,0.10)] focus-within:-translate-y-0.5 focus-within:border-blue-400 focus-within:shadow-[0_18px_45px_rgba(59,130,246,0.15)] dark:border-slate-700 dark:bg-[#111A2E] dark:shadow-[0_12px_35px_rgba(0,0,0,0.35)] dark:hover:border-slate-600 dark:focus-within:border-blue-500"
          >
            <!-- Search Icon -->
            <svg
              class="h-5 w-5 shrink-0 text-slate-400 dark:text-slate-500"
              viewBox="0 0 18 18"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="m15.75 15.75-3.262-3.262M14.25 8.25a6 6 0 1 1-12 0 6 6 0 0 1 12 0"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>

            <input
              id="input"
              type="text"
              placeholder="Search for a city..."
              class="h-full w-full bg-transparent text-base text-slate-800 placeholder:text-slate-400 outline-none dark:text-slate-100 dark:placeholder:text-slate-500"
            />
          </div>

          <!-- Suggestions -->
          <div
            id="suggestions"
            class="absolute top-full left-0 z-50 mt-3 hidden w-full overflow-hidden rounded-2xl border border-[#E6EEF8] bg-white p-2 shadow-[0_12px_35px_rgba(15,23,42,0.12)] dark:border-slate-700 dark:bg-[#111A2E] dark:shadow-[0_12px_35px_rgba(0,0,0,0.4)]"
          >
            <h5
              class="border-b border-[#EEF3F9] px-5 py-3 text-xs font-semibold uppercase tracking-wider text-slate-500 hidden sm:block dark:border-slate-700 dark:text-slate-400"
            >
              Search Results
            </h5>

            <!-- Results go here -->
          </div>
        </div>

        <!-- Current Location -->
        <button
          id="getLocationBtn"
          class="group flex h-14 w-14 shrink-0 items-center justify-center rounded-2xl border border-[#E6EEF8] bg-white shadow-[0_12px_35px_rgba(15,23,42,0.08)] transition-all duration-300 hover:-translate-y-0.5 hover:border-blue-300 hover:bg-blue-50 hover:shadow-[0_18px_45px_rgba(59,130,246,0.15)] active:scale-95 dark:border-slate-700 dark:bg-[#111A2E] dark:shadow-[0_12px_35px_rgba(0,0,0,0.35)] dark:hover:border-blue-500/50 dark:hover:bg-blue-500/10"
        >
          <img
            src="./icons/target.png"
            class="h-5 w-5 transition-transform duration-300 group-hover:scale-110"
          />
        </button>

        <!-- Theme -->
        <button
          id="changeThemeBtn"
          class="group flex h-14 w-14 shrink-0 items-center justify-center rounded-2xl border border-[#E6EEF8] bg-white shadow-[0_12px_35px_rgba(15,23,42,0.08)] transition-all duration-300 hover:-translate-y-0.5 hover:border-blue-300 hover:bg-blue-50 hover:shadow-[0_18px_45px_rgba(59,130,246,0.15)] active:scale-95 dark:border-slate-700 dark:bg-[#111A2E] dark:shadow-[0_12px_35px_rgba(0,0,0,0.35)] dark:hover:border-blue-500/50 dark:hover:bg-blue-500/10"
        >
          <img
            src="./icons/night-mode.png"
            class="h-5 w-5 transition-transform duration-300 group-hover:rotate-12"
          />
        </button>
      </div>
      <!--Search section Ends-->

      <!--Main weather sections Begins-->
      <section class="mt-5 grid grid-cols-1 gap-6 lg:grid-cols-3">
        <!-- Card 1 -->
        <div
          class="lg:col-span-1 rounded-3xl border border-[#E6EEF8] bg-white p-7 shadow-[0_12px_35px_rgba(15,23,42,0.08)] dark:border-slate-700 dark:bg-[#111A2E] dark:shadow-[0_12px_35px_rgba(0,0,0,0.35)]"
          id="currentWeather"
        >
          <!-- Location -->
          <div class="flex items-center gap-2 min-w-0">
            <img src="./icons/location.png" class="h-7 w-7 shrink-0" />

            <h2
              class="min-w-0 wrap-break-wordwords text-2xl font-bold tracking-tight text-slate-900 dark:text-white"
            ></h2>
          </div>

          <!-- Date -->
          <p class="mt-2 text-sm text-slate-500 dark:text-slate-400"></p>

          <!-- Weather Badge -->
          <div
            class="mt-6 inline-flex items-center gap-2 rounded-full border border-slate-200 bg-slate-50 px-4 py-0.5 shadow-sm dark:border-slate-700 dark:bg-slate-800/60"
          >
            <img src="" class="h-10 w-10" />
            <span
              class="text-sm font-medium text-slate-700 dark:text-slate-200"
            >
            </span>
          </div>

          <!-- Temperature Section -->
          <div class="mt-8 grid grid-cols-12 items-center gap-2">
            <!-- Temperature -->
            <div class="col-span-7 min-w-0">
              <div class="flex items-start">
                <span
                  class="text-7xl xl:text-8xl font-bold leading-none tracking-tighter text-slate-900 dark:text-white"
                >
                </span>

                <span
                  class="ml-1 mt-1 text-4xl font-semibold text-slate-400 dark:text-slate-500"
                >
                  °C
                </span>
              </div>

              <p class="mt-4 text-lg text-slate-500 dark:text-slate-400">
                Feels like
                <span
                  class="font-semibold text-slate-700 dark:text-slate-200"
                ></span>
              </p>
            </div>

            <!-- Weather Illustration -->
            <div class="col-span-5 flex justify-end">
              <img src="" class="h-36 w-36 object-contain drop-shadow-xl" />
            </div>
          </div>

          <!-- Bottom Information -->
          <div
            class="grid grid-cols-2 border-[#E6EEF8] pt-6 lg:grid-cols-4 gap-2 dark:border-slate-700"
          >
            <!-- Sunrise -->
            <div
              class="flex min-w-0 flex-col items-center justify-center border-r border-b border-[#E6EEF8] py-1 lg:border-b-0 dark:border-slate-700"
            >
              <img src="./icons/sunrise.png" class="h-6 w-6" />

              <p
                class="mt-2 text-center text-xs text-slate-500 dark:text-slate-400"
              >
                Sunrise
              </p>

              <p
                class="mt-1 wrap-break-wordbreak-words text-center text-sm font-semibold text-slate-900 dark:text-white"
              ></p>
            </div>

            <!-- Sunset -->
            <div
              class="flex min-w-0 flex-col items-center justify-center border-b border-[#E6EEF8] py-1 lg:border-r lg:border-b-0 dark:border-slate-700"
            >
              <img src="./icons/sunset.png" class="h-6 w-6" />

              <p
                class="mt-2 text-center text-xs text-slate-500 dark:text-slate-400"
              >
                Sunset
              </p>

              <p
                class="mt-1 wrap-break-wordbreak-words text-center text-sm font-semibold text-slate-900 dark:text-white"
              ></p>
            </div>

            <!-- UV Index -->
            <div
              class="group relative flex min-w-0 flex-col items-center justify-center border-r border-[#E6EEF8] py-1 dark:border-slate-700"
            >
              <img src="./icons/uv_index.png" class="h-6 w-6" />

              <p
                class="mt-2 text-center text-xs text-slate-500 dark:text-slate-400"
              >
                UV Index
              </p>

              <p
                class="mt-1 text-center text-sm font-semibold text-slate-900 dark:text-white"
              ></p>

              <!-- Custom Tooltip -->
              <div
                class="pointer-events-none absolute left-1/2 top-full z-50 mt-4 w-max -translate-x-1/2 rounded-xl border border-[#E6EEF8] bg-white px-4 py-3 opacity-0 shadow-[0_12px_32px_rgba(15,23,42,0.12)] transition-all duration-200 group-hover:opacity-100 dark:border-slate-700 dark:bg-[#1A2438] dark:shadow-[0_12px_32px_rgba(0,0,0,0.4)]"
              >
                <div class="flex items-center gap-3">
                  <div
                    class="flex h-10 w-10 items-center justify-center rounded-full bg-amber-100 dark:bg-amber-500/20"
                  >
                    <img src="./icons/uv_index.png" class="h-5 w-5" />
                  </div>

                  <div>
                    <p
                      class="text-sm font-semibold text-slate-900 dark:text-white"
                    ></p>

                    <p class="text-xs text-slate-500 dark:text-slate-400"></p>
                  </div>
                </div>
              </div>
            </div>

            <!-- Air Quality -->
            <div
              class="group relative flex min-w-0 flex-col items-center justify-center border-r border-[#E6EEF8] py-1 dark:border-slate-700"
            >
              <img src="./icons/air_quality.png" class="h-6 w-6" />

              <p
                class="mt-2 text-center text-xs text-slate-500 dark:text-slate-400"
              >
                Air Quality
              </p>

              <p
                class="mt-1 text-center text-sm font-semibold text-slate-900 dark:text-white"
              ></p>

              <!-- Custom Tooltip -->
              <div
                class="pointer-events-none absolute left-1/2 top-full z-50 mt-4 w-max -translate-x-1/2 rounded-xl border border-[#E6EEF8] bg-white px-4 py-3 opacity-0 shadow-[0_12px_32px_rgba(15,23,42,0.12)] transition-all duration-200 group-hover:opacity-100 dark:border-slate-700 dark:bg-[#1A2438] dark:shadow-[0_12px_32px_rgba(0,0,0,0.4)]"
              >
                <div class="flex items-center gap-3">
                  <div
                    class="flex h-10 w-10 items-center justify-center rounded-full bg-amber-100 dark:bg-amber-500/20"
                  >
                    <img src="./icons/air_quality.png" class="h-5 w-5" />
                  </div>

                  <div>
                    <p
                      class="text-sm font-semibold text-slate-900 dark:text-white"
                    ></p>

                    <p class="text-xs text-slate-500 dark:text-slate-400"></p>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Card 2 -->
        <div
          class="lg:col-span-2 rounded-3xl border border-[#E6EEF8] bg-white p-7 shadow-[0_12px_35px_rgba(15,23,42,0.08)] flex flex-col dark:border-slate-700 dark:bg-[#111A2E] dark:shadow-[0_12px_35px_rgba(0,0,0,0.35)]"
          id="card2"
        >
          <!-- Header -->
          <div class="flex items-start justify-between">
            <div>
              <div class="flex items-center gap-3">
                <h2
                  class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white"
                >
                  Hourly Forecast
                </h2>
              </div>

              <p class="mt-2 text-sm text-slate-500 dark:text-slate-400">
                Temperature trend over the next 6 hours
              </p>
            </div>

            <span
              class="rounded-full border border-[#E6EEF8] bg-[#F8FBFF] px-4 py-1.5 text-xs font-semibold tracking-wide text-slate-600 shadow-sm dark:border-slate-700 dark:bg-slate-800/60 dark:text-slate-300"
            >
              Next 6 Hours
            </span>
          </div>

          <!-- Hourly Cards -->
          <div
            id="hourlyForecast"
            class="mt-8 grid grid-cols-3 gap-4 lg:grid-cols-6"
          ></div>

          <!-- Temperature Graph -->
          <div class="mt-10 bg-white dark:bg-transparent">
            <div class="h-24">
              <canvas id="hourlyChart" class="h-full w-full"></canvas>
            </div>
          </div>
        </div>

        <!-- Card 3 -->
        <!-- Card 3 -->
        <div
          class="lg:col-span-1 flex flex-col rounded-3xl border border-[#E6EEF8] bg-white p-7 shadow-[0_12px_35px_rgba(15,23,42,0.08)] dark:border-slate-700 dark:bg-[#111A2E] dark:shadow-[0_12px_35px_rgba(0,0,0,0.35)]"
          id="card3"
        >
          <div class="grid grid-cols-2 gap-6 auto-rows-fr">
            <!-- Card 1 -->
            <div
              class="rounded-3xl border border-[#E6EEF8] bg-white shadow-[0_12px_35px_rgba(15,23,42,0.08)] p-6 dark:border-slate-700 dark:bg-[#1A2438] dark:shadow-[0_12px_35px_rgba(0,0,0,0.35)]"
              id="windSpeedCard"
            >
              <div class="flex gap-2 min-w-0 items-center">
                <div
                  class="h-8 w-8 shrink-0 bg-purple-100 rounded-full items-center flex justify-center dark:bg-purple-500/20"
                >
                  <img
                    src="./icons/wind_purple.png"
                    class="h-6 w-6 shrink-0 object-contain"
                  />
                </div>

                <p
                  class="min-w-0 truncate text-sm text-black dark:text-slate-200"
                >
                  Wind
                </p>
              </div>

              <div class="flex flex-col mt-4 gap-3 min-w-0">
                <h2
                  class="min-w-0 truncate text-2xl font-bold tracking-tight text-slate-900 dark:text-white"
                ></h2>
                <p
                  class="min-w-0 truncate text-sm text-slate-500 dark:text-slate-400"
                >
                  NW
                </p>
              </div>
            </div>

            <!-- Card 2 -->
            <div
              class="rounded-3xl border border-[#E6EEF8] bg-white shadow-[0_12px_35px_rgba(15,23,42,0.08)] p-6 dark:border-slate-700 dark:bg-[#1A2438] dark:shadow-[0_12px_35px_rgba(0,0,0,0.35)]"
              id="HumidityPerCard"
            >
              <div class="flex gap-2 min-w-0 items-center">
                <div
                  class="h-8 w-8 shrink-0 bg-blue-100 rounded-full items-center flex justify-center dark:bg-blue-500/20"
                >
                  <img
                    src="./icons/raindrop.png"
                    class="h-4 w-4 shrink-0 object-contain"
                  />
                </div>

                <p
                  class="min-w-0 truncate text-sm text-black dark:text-slate-200"
                >
                  Humidity
                </p>
              </div>

              <div class="flex flex-col mt-4 gap-3 min-w-0">
                <h2
                  class="min-w-0 truncate text-2xl font-bold tracking-tight text-slate-900 dark:text-white"
                ></h2>
                <p
                  class="min-w-0 truncate text-sm text-slate-500 dark:text-slate-400"
                ></p>
              </div>
            </div>

            <!-- Card 3 -->
            <div
              class="rounded-3xl border border-[#E6EEF8] bg-white shadow-[0_12px_35px_rgba(15,23,42,0.08)] p-6 dark:border-slate-700 dark:bg-[#1A2438] dark:shadow-[0_12px_35px_rgba(0,0,0,0.35)]"
              id="PressureCard"
            >
              <div class="flex gap-2 min-w-0 items-center">
                <div
                  class="h-8 w-8 shrink-0 bg-green-100 rounded-full items-center flex justify-center dark:bg-green-500/20"
                >
                  <img
                    src="./icons/gauge.png"
                    class="h-6 w-6 shrink-0 object-contain"
                  />
                </div>

                <p
                  class="min-w-0 truncate text-sm text-black dark:text-slate-200"
                >
                  Pressure
                </p>
              </div>

              <div class="flex flex-col mt-4 gap-3 min-w-0">
                <h2
                  class="min-w-0 truncate text-2xl font-bold tracking-tight text-slate-900 dark:text-white"
                ></h2>
                <p
                  class="min-w-0 truncate text-sm text-slate-500 dark:text-slate-400"
                ></p>
              </div>
            </div>

            <!-- Card 4 -->
            <div
              class="rounded-3xl border border-[#E6EEF8] bg-white shadow-[0_12px_35px_rgba(15,23,42,0.08)] p-6 dark:border-slate-700 dark:bg-[#1A2438] dark:shadow-[0_12px_35px_rgba(0,0,0,0.35)]"
              id="VisibilityCard"
            >
              <div class="flex gap-2 min-w-0 items-center">
                <div
                  class="h-8 w-8 shrink-0 bg-purple-100 rounded-full items-center flex justify-center dark:bg-purple-500/20"
                >
                  <img
                    src="./icons/eye.png"
                    class="h-6 w-6 shrink-0 object-contain"
                  />
                </div>

                <p
                  class="min-w-0 truncate text-sm text-black dark:text-slate-200"
                >
                  Visibility
                </p>
              </div>

              <div class="flex flex-col mt-4 gap-3 min-w-0">
                <h2
                  class="min-w-0 truncate text-2xl font-bold tracking-tight text-slate-900 dark:text-white"
                ></h2>
                <p
                  class="min-w-0 truncate text-sm text-slate-500 dark:text-slate-400"
                ></p>
              </div>
            </div>
          </div>
        </div>
        <!-- Card 4 -->
        <div
          class="lg:col-span-2 flex flex-col rounded-3xl border border-[#E6EEF8] bg-white p-7 shadow-[0_12px_35px_rgba(15,23,42,0.08)] dark:border-slate-700 dark:bg-[#111A2E] dark:shadow-[0_12px_35px_rgba(0,0,0,0.35)]"
        >
          <!-- Header -->
          <div class="mb-6 flex items-center justify-between">
            <h2
              class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white"
            >
              7-Day Forecast
            </h2>
          </div>

          <!-- Forecast List -->
          <div class="flex flex-col" id="forecastCard">
            <!-- Forecast Row -->
          </div>
        </div>
      </section>
      <!--Main weather sections Begins-->
    </main>
    <footer></footer>
    <script>
      const themeBtn = document.getElementById("changeThemeBtn");
      const themeIcon = themeBtn.children[0];
      const locationIcon =
        document.getElementById("getLocationBtn").children[0];

      function updateIcons(isDark) {
        themeIcon.src = isDark
          ? "./icons/whiteTheme.png"
          : "./icons/night-mode.png";

        locationIcon.src = isDark
          ? "./icons/whiteTarget.png"
          : "./icons/target.png";
      }

      // Restore saved theme
      const savedTheme = localStorage.getItem("theme") || "light";
      const isDark = savedTheme === "dark";

      document.documentElement.classList.toggle("dark", isDark);
      updateIcons(isDark);

      // Toggle theme
      themeBtn.addEventListener("click", () => {
        document.documentElement.classList.toggle("dark");

        const isDark = document.documentElement.classList.contains("dark");

        localStorage.setItem("theme", isDark ? "dark" : "light");

        updateIcons(isDark);
      });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/plugin/customParseFormat.js"></script>

    <script src="./server.js" type="module"></script>
  </body>
</html>
